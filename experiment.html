<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>单摆实验 · 正式实验</title>
    <link
      href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="./css/common.css" />
    <script src="https://unpkg.com/jspsych@8.2.3/dist/index.browser.min.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0/dist/index.browser.min.js"></script>
  </head>
  <body>
    <main id="setup" class="page">
      <nav class="site-nav">
        <a href="./index.html">首页</a>
        <a href="./builder.html">配置导出</a>
      </nav>
      <h1>正式实验</h1>
      <p class="hint">
        请先在「配置导出」页生成 JSON v4，再于此处导入。含<strong>练习</strong>、<strong>正式</strong>试次与<strong>文字显示</strong>单元；单摆单元均有注视点，四段段长为 x·T（默认可视 1T、不可视 0.4T）。正式试次播放结束后需汇报点估计与确信范围；文字单元按空格继续。
      </p>
      <div class="experiment-file-row">
        <label>
          配置文件
          <input type="file" id="cfg-file" accept=".json,application/json" />
        </label>
      </div>
      <button type="button" id="start-btn" class="primary">加载配置并开始</button>
      <div id="setup-error" class="error-banner" role="alert"></div>
    </main>

    <div id="jspsych-target" class="experiment-stage" style="display: none"></div>

    <script src="./js/pendulum.js"></script>
    <script src="./js/experiment.js"></script>
  </body>
</html>
