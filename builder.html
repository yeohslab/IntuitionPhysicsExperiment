<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>单摆实验 · 配置导出</title>
    <link rel="stylesheet" href="./css/common.css" />
  </head>
  <body>
    <main class="page">
      <nav class="site-nav">
        <a href="./index.html">首页</a>
        <a href="./experiment.html">正式实验</a>
      </nav>
      <h1>实验配置（Block / 试次）</h1>
      <p class="hint">
        配置使用<strong>角度制</strong>与<strong>米</strong>：启动角默认 45°，角速度默认 0°/s，摆长默认 1 m。每试次开始先呈现注视点「+」。
        四段时长均为 <code>T/x</code>，默认可视/不可视各 <code>T/2</code>（即 <code>x=2</code>）。
        <code>T</code> 由守恒能量 <code>Ē</code> 推算（摆动：椭圆积分；转圈：∫dθ/ω(θ)）。轨迹用 RK4 解 <code>θ̈=−(g/L)sinθ</code>，与 T 一致。被试汇报用度（°）。
        四段顺序：可视₁ → 不可视₁ → 可视₂ → 不可视₂。导出 JSON v3 后在正式实验页导入。
      </p>

      <div id="error-banner" class="error-banner" role="alert"></div>

      <div class="toolbar">
        <button type="button" id="btn-add-block" class="primary">添加 Block</button>
        <button type="button" id="btn-export" class="primary">导出 JSON</button>
        <button type="button" id="btn-import">导入 JSON</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden />
      </div>

      <div id="blocks-root"></div>
    </main>
    <script src="./js/pendulum.js"></script>
    <script src="./js/builder.js"></script>
  </body>
</html>
